<script>
// GESTIÓN DEL CAMBIO DE IMAGEN Y ESTADO (STAGE & THUMBS)
function goToSlide(gallery, index) {
    const slides = gallery.querySelectorAll('.unav-mainImageWrapper');
    const thumbs = gallery.querySelectorAll('.unav-thumbItem');
    const counter = gallery.querySelector('.unav-counter');
    
    if (index < 0 || index>= slides.length) return;

    const targetSlide = slides[index];
    const currentActive = gallery.querySelector('.unav-mainImageWrapper.unav-isActive');

    if (currentActive === targetSlide) return;

    // Efecto Cross-Fade OOCSS
    if (currentActive) {
        currentActive.classList.remove('unav-isActive');
        currentActive.classList.add('unav-isOutgoing');
        
        setTimeout(() => {
            if (!currentActive.classList.contains('unav-isActive')) {
                currentActive.classList.remove('unav-isOutgoing');
            }
        }, 250); 
    }
    
    const currentThumb = gallery.querySelector('.unav-thumbItem.unav-isSelected');
    if (currentThumb) currentThumb.classList.remove('unav-isSelected');
    
    targetSlide.classList.add('unav-isActive');
    thumbs[index].classList.add('unav-isSelected');
    
    // Actualización dinámica del contador basado en el número total real de nodos HTML
    if (counter) counter.innerText = `${index + 1} / ${slides.length}`;
    
    thumbs[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

// LÓGICA DE CONTROLES ANTERIOR/SIGUIENTE (FLECHAS DEL STAGE)
function changeSlide(btn, delta) {
    const gallery = btn.closest('.unav-mediaGallery');
    const thumbs = gallery.querySelectorAll('.unav-thumbItem');
    const totalPhotos = thumbs.length;
    const currentIdx = Array.from(thumbs).findIndex(t => t.classList.contains('unav-isSelected'));
    
    let nextIdx = currentIdx + delta;
    if (nextIdx>= totalPhotos) nextIdx = 0;
    if (nextIdx < 0) nextIdx = totalPhotos - 1;
    
    goToSlide(gallery, nextIdx);
}

// SCROLL DIRECCIONAL INTELIGENTE PARA MINIATURAS
window.scrollThumbGrid = function(btn, direction) {
    const gallery = btn.closest('.unav-mediaGallery');
    const grid = gallery.querySelector('.unav-thumbGrid');
    const scrollDir = gallery.getAttribute('data-unav-scrolldir');
    
    if (scrollDir === 'horizontal') {
        grid.scrollBy({ left: 100 * direction, behavior: 'smooth' });
    } else {
        grid.scrollBy({ top: 150 * direction, behavior: 'smooth' });
    }
}

// INICIALIZACIÓN Y CONFIGURACIÓN DEL RESIZE OBSERVER MULTI-LAYOUT
document.addEventListener('DOMContentLoaded', () => {
    const galleries = document.querySelectorAll('.unav-mediaGallery');
    
    const observer = new ResizeObserver(entries => {
        for (let entry of entries) {
            const wrapper = entry.target;
            const gallery = wrapper.querySelector('.unav-mediaGallery');
            if (!gallery) continue;
            
            const prevBtnIcon = gallery.querySelector('.unav-thumbPrevBtn .unav-botonIcono');
            const nextBtnIcon = gallery.querySelector('.unav-thumbNextBtn .unav-botonIcono');
            
            if (wrapper.offsetWidth <= 550) {
                gallery.setAttribute('data-unav-scrolldir', 'horizontal');
                if (prevBtnIcon) prevBtnIcon.className = 'bi bi-chevron-left unav-botonIcono';
                if (nextBtnIcon) nextBtnIcon.className = 'bi bi-chevron-right unav-botonIcono';
            } else {
                gallery.setAttribute('data-unav-scrolldir', 'vertical');
                if (prevBtnIcon) prevBtnIcon.className = 'bi bi-chevron-up unav-botonIcono';
                if (nextBtnIcon) nextBtnIcon.className = 'bi bi-chevron-down unav-botonIcono';
            }
        }
    });

    galleries.forEach((gallery) => {
        const wrapper = gallery.closest('.unav-galleryWrapper');
        if (wrapper) observer.observe(wrapper);
        
        // Inicializar los contadores de forma nativa al arrancar según el HTML presente
        const slides = gallery.querySelectorAll('.unav-mainImageWrapper');
        const counter = gallery.querySelector('.unav-counter');
        if (counter && slides.length> 0) {
            counter.innerText = `1 / ${slides.length}`;
        }
    });
});

// NAVEGACIÓN GLOBAL POR TECLADO (ACCESIBILIDAD)
document.addEventListener('keydown', (e) => {
    const gallery = document.querySelector('.unav-mediaGallery'); // Aplica a la primera en pantalla
    if (!gallery) return;
    if (e.key === "ArrowLeft") changeSlide(gallery.querySelector('.unav-prevBtn'), -1);
    if (e.key === "ArrowRight") changeSlide(gallery.querySelector('.unav-nextBtn'), 1);
});
</script>
