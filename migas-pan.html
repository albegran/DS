<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migas de Pan | Design System UNAV</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="unav-styles.css">   

    <style>
        /* Estilos de contexto para la documentación */
        html { scroll-behavior: smooth; }
        body { background-color: var(--unav-grey-100); }
    </style>
</head>
<body class="unav-font-primary unav-weight-regular unav-text-1125">

    <nav style="background-color: #ffffff; border-bottom: 1px solid var(--unav-grey-200); padding: var(--unav-spacing-md) 0; position: sticky; top: 0; z-index: var(--unav-zIndex-sticky);">
        <div class="container-lg d-flex justify-content-between align-items-center position-relative">
            
            <div>
                <a  href="indice.html" class="unav-boton unav-botonSecundario">

                    <span class="d-none d-md-inline">Volver al Índice</span>
                </a>
            </div>
    
            <span class="unav-font-primary-condensed unav-weight-regular unav-text-150 m-0 position-absolute start-50 translate-middle-x" style="color: var(--unav-rojo-500); line-height: 1;">

            </span>
    
        </div>

    <main class="container-lg">

            <h1 class="unav-font-primary unav-weight-medium unav-text-200" style="color: var(--unav-black-900); margin-bottom: var(--unav-spacing-sm) !important;">Migas de Pan</h1>
        </header>

        <section class="unav-card unav-cardSolid">
            <h2 class="unav-font-primary unav-weight-bold unav-text-200" style="border-bottom: 1px solid var(--unav-grey-300); padding-bottom: var(--unav-spacing-sm); margin-bottom: var(--unav-spacing-xl); color: var(--unav-black-900);">Ejemplo del Componente</h2>

            <nav aria-label="Breadcrumb">
                <ol class="unav-breadcrumbs">
                    <li class="unav-breadcrumbHere">Estás en:</li>
                    
                    <li class="unav-breadcrumbItem">
                        <a href="https://www.unav.edu" class="unav-breadcrumbLink">
                            <span>Inicio</span>
                        </a>
                    </li>
                    
                    <li class="unav-breadcrumbItem">
                        <a href="https://www.unav.edu/web/facultad-de-ciencias" class="unav-breadcrumbLink">
                            <span>Facultad de Ciencias</span>
                        </a>
                    </li>
                    
                    <li class="unav-breadcrumbItem">
                        <a href="https://www.unav.edu/web/facultad-de-ciencias/conoce-la-facultad" class="unav-breadcrumbLink">
                            <span>Conoce la Facultad</span>
                        </a>
                    </li>
                    
                    <li class="unav-breadcrumbItem">
                        <a href="https://www.unav.edu/web/facultad-de-ciencias/conoce-la-facultad/quienes-somos" class="unav-breadcrumbLink">
                            <span>Quiénes Somos</span>
                        </a>
                    </li>
                    
                    <li class="unav-breadcrumbItem unav-isActive">
                        <span  aria-current="page">Vicedecanato de Estudiantes</span>                        
                    </li>
                </ol>
            </nav>
        </section>

    </main>

    <footer style="background-color: #ffffff; border-top: 1px solid var(--unav-grey-200); padding: var(--unav-spacing-lg) 0; margin-top: var(--unav-spacing-3xl);">
        <div class="container-lg d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div style="display: flex; align-items: center; gap: var(--unav-spacing-sm);">
                <svg class="unav-customIconSvg unav-icono-xl" style="color: var(--unav-rojo-500);" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12A7 10 0 0 1 5 12A7 10 0 0 1 19 12Z M17 12A5 8 0 0 0 7 12A5 8 0 0 0 17 12Z" />
                </svg>
                <span class="unav-font-primary unav-weight-bold unav-text-100" style="color: var(--unav-black-800);">Design System UNAV</span>
            </div>
            <p class="unav-font-primary unav-weight-regular unav-text-075 m-0" style="color: var(--unav-grey-500);">
